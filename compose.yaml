# Local/server compose: put TLS termination in front of the loopback MCP port.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vidawheel_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - bot_data:/var/lib/postgresql/data
      - ./postgresql-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d vidawheel_bot"]
      interval: 3s
      retries: 20
  mcp:
    build: .
    env_file: .env
    environment:
      BOT_CONFIG: /run/config/bots.json
    volumes:
      - ./config.local.json:/run/config/bots.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  receiver:
    build: .
    command: ["python", "-m", "event_receiver.main"]
    profiles: ["feishu"]
    env_file: .env
    environment:
      BOT_CONFIG: /run/config/bots.json
    volumes:
      - ./config.local.json:/run/config/bots.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  bot_data:
