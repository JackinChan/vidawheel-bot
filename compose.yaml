# Local/server compose: put TLS termination in front of the loopback MCP port.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vidawheel_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - bot_data:/var/lib/postgresql/data
      - ./postgresql-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d vidawheel_bot"]
      interval: 3s
      retries: 20
  mcp:
    build: .
    env_file: .env
    environment:
      BOT_CONFIG: /run/config/bots.json
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mcp:8000
    volumes:
      - ./config.local.json:/run/config/bots.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  receiver:
    build: .
    command: ["python", "-m", "event_receiver.main"]
    profiles: ["feishu"]
    env_file: .env
    environment:
      BOT_CONFIG: /run/config/bots.json
    volumes:
      - ./config.local.json:/run/config/bots.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ["worker"]
    command: ["python", "-m", "analysis_worker.main"]
    env_file: .env
    environment:
      WORKER_MCP_URL: http://mcp:8000/mcp
      WORKER_REPOSITORY: /workspace
      CODEX_HOME: /home/bot/.codex
    volumes:
      - ./worker-workspace:/workspace:ro
      - codex_home:/home/bot/.codex
    depends_on:
      - mcp
    restart: unless-stopped
  receiver-http:
    build: .
    profiles: ["callback"]
    command: ["uvicorn", "event_receiver.http:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: .env
    environment:
      BOT_CONFIG: /run/config/bots.json
    volumes:
      - ./config.local.json:/run/config/bots.json:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  bot_data:
  codex_home:
