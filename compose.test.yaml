    environment:
      BOT_TEST_MODE: "1"
      TEST_FEISHU_API_BASE: http://fixture:8002
  fixture:
    image: vidawheel-bot-mcp:latest
    command: ["uvicorn", "tests.feishu_fixture:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes:
      - ./tests:/app/tests:ro
